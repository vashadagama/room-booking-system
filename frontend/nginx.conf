server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Приложение живёт по адресам вроде /rooms и /profile, поэтому любой
    # неизвестный путь отдаём index.html — иначе перезагрузка страницы
    # даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # У собранных файлов в имени хеш содержимого — их можно кэшировать
    # надолго и не бояться, что браузер принесёт старый билд.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: без заголовков Upgrade и Connection апгрейд не пройдёт.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}