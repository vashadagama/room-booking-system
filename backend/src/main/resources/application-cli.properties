# Профиль консольных команд:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=cli"
#
# Без этого профиля оболочка не поднимается — иначе контейнер в Docker
# стартовал бы и завис на пустом stdin.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Чтобы консоль не выглядела как лог Spring Boot.
spring.jpa.show-sql=false