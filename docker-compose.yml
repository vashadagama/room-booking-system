services:
  postgres:
    image: postgres:18-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db # этот
      POSTGRES_USER: booking_user # и этот
      POSTGRES_PASSWORD: booking_password # и этот будут заменены в лаб 8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: